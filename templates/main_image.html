{% extends "base.html" %}
{% block title %}Главная{% endblock %}
{% block content %}
<div class="text-center">
    <!-- Ваше изображение -->
    <img src="{{ url_for('static', filename='images/ваш_файл.png') }}" 
         alt="Изображение" 
         usemap="#image-map"
         style="max-width: 100%; height: auto;">

    <!-- Кликабельные области -->
    <map name="image-map">
        <!-- Область для перехода в галерею дизайна -->
        <area shape="rect" coords="50,100,250,180" 
              href="{{ url_for('design_gallery') }}" 
              alt="Дизайн и цены" 
              title="Дизайн и цены">
              
        <!-- Другие области добавьте по необходимости -->
    </map>
</div>
{% endblock %}

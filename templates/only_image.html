<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Главная</title>
    <style>
        /* Полностью убираем все отступы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Контейнер для изображения и кнопок */
        .fullscreen-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        /* Изображение на весь экран */
        .fullscreen-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* Затемнение поверх изображения для лучшей читаемости текста */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* полупрозрачное затемнение */
            z-index: 1;
        }
        
        /* Контейнер для текста */
        .hero-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 2;
            width: 80%;
            max-width: 800px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .hero-title {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: 2px;
            animation: fadeInDown 1s ease;
        }
        
        .hero-subtitle {
            font-size: 24px;
            margin-bottom: 30px;
            opacity: 0.9;
            animation: fadeInUp 1s ease 0.3s both;
        }
        
        .hero-description {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
            opacity: 0.85;
            animation: fadeIn 1s ease 0.6s both;
        }
        
        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
            animation: fadeIn 1s ease 0.9s both;
        }
        
        .feature-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .feature-item:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
        }
        
        /* Анимации */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Общий стиль для всех кнопок */
        .image-button {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            border: 2px solid white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .image-button:hover {
            background-color: white;
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            color: #000;
        }
        
        /* Позиции кнопок (настройте под ваше изображение) */
        .button-1 {
            top: 9%;
            left: 60%;
        }
        
        .button-2 {
            top: 5%;
            left: 65%;
        }
        
        .button-3 {
            top: 5%;
            left: 83%;
        }
        
        .button-4 {
            top: 5%;
            right: 20%;
        }
        
        /* Для мобильных устройств */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 32px;
            }
            .hero-subtitle {
                font-size: 18px;
            }
            .hero-description {
                font-size: 14px;
            }
            .feature-item {
                padding: 8px 15px;
                font-size: 12px;
            }
            .image-button {
                padding: 8px 15px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="fullscreen-container">
        <!-- Изображение -->
        <img src="{{ url_for('static', filename='images/main.png') }}" 
             alt="Главное изображение" 
             class="fullscreen-image">
        
        <!-- Затемняющий слой -->
        <div class="overlay"></div>
        
        <!-- Текстовый блок с описанием -->
        <div class="hero-content">
            <h1 class="hero-title">СОЗДАНИЕ БОТОВ</h1>
            <p class="hero-subtitle">Автоматизация без границ</p>
            <p class="hero-description">
                Разрабатываем интеллектуальных ботов для бизнеса и развлечений.<br>
                Telegram, Discord, WhatsApp — любые платформы под ваши задачи.
            </p>
            
            <div class="features">
                <span class="feature-item">🤖 ИИ-ассистенты</span>
                <span class="feature-item">💰 Оплата внутри ботов</span>
                <span class="feature-item">📊 Аналитика</span>
                <span class="feature-item">🚀 24/7 поддержка</span>
                <span class="feature-item">⚡ Быстрый старт</span>
            </div>
        </div>
        
        <!-- Кнопки (оставляем как есть) -->
        <a href="{{ url_for('price') }}" class="image-button button-1">ЦЕНЫ</a>
        <a href="{{ url_for('examples') }}" class="image-button button-2">ПРИМЕРЫ РАБОТ</a>
        <a href="{{ url_for('support') }}" class="image-button button-3">ПОДДЕРЖКА</a>
        <a href="{{ url_for('personal_account') }}" class="image-button button-4">ЛИЧНЫЙ КАБИНЕТ</a>
    </div>
</body>
</html>

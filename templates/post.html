{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('index') }}">Главная</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ post.title }}</li>
        </ol>
    </nav>
    <h1>{{ post.title }}</h1>
    <p class="text-muted">{{ post.date_posted.strftime('%d.%m.%Y %H:%M') }}</p>
    <div class="mt-4">
        {{ post.content | safe }}
    </div>
    <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">← Назад</a>
{% endblock %}
